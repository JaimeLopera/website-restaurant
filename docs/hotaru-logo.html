<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotaru logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Shippori+Mincho:wght@500&display=swap">
<style>
  body { margin: 0; display: grid; gap: 0; font-family: system-ui, sans-serif; }
  .demo { display: grid; place-items: center; min-height: 50vh; }
  .dark  { background: #1C1B19; }
  .light { background: #F5F1EA; }
  .demo svg { width: min(420px, 80vw); height: auto; }
</style>
</head>
<body>

<!-- Logo principal: sobre fondo oscuro (sumi). Hotaru en washi y 蛍 en oro, como en la cabecera y el pie. -->
<div class="demo dark">
  <svg class="logo" viewBox="0 0 144 40" role="img" aria-label="Hotaru" xmlns="http://www.w3.org/2000/svg">
    <text x="0" y="31" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="500" font-size="36" fill="#F5F1EA">Hotaru<tspan dx="10" font-family="'Shippori Mincho', 'Yu Mincho', serif" font-size="28" fill="#C8A46B">蛍</tspan></text>
  </svg>
</div>

<!-- Variante para fondos claros (washi o sakura): el oro no se lee ahí (3:1), así que Hotaru va en sumi y 蛍 en urushi. -->
<div class="demo light">
  <svg class="logo" viewBox="0 0 144 40" role="img" aria-label="Hotaru" xmlns="http://www.w3.org/2000/svg">
    <text x="0" y="31" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="500" font-size="36" fill="#1C1B19">Hotaru<tspan dx="10" font-family="'Shippori Mincho', 'Yu Mincho', serif" font-size="28" fill="#9B2D24">蛍</tspan></text>
  </svg>
</div>

</body>
</html>
